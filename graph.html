<!DOCTYPE html>
<html>

<head>
    <title>Random ass chart</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background-color: #f4f4f4;
        }

        #myChart {
            max-width: 800px;
            height: 500px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>
    <h2>Monthly Sales and Average</h2>
    <div id="myChart"></div>

    <script>
        Highcharts.chart('myChart', {
            chart: {
                zoomType: 'xy'
            },
            title: {
                text: 'Monthly Sales Report'
            },
            xAxis: {
                categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May']
            },
            yAxis: [{
                title: {
                    text: 'Sales ($)'
                }
            }],
            tooltip: {
                shared: true
            },
            series: [{
                name: 'Product A',
                type: 'column',
                data: [120, 150, 170, 140, 190],
                color: '#7cb5ec'
            }, {
                name: 'Product B',
                type: 'column',
                data: [80, 90, 100, 95, 130],
                color: '#90ed7d'
            }, {
                name: 'Average', 
                data: [100, 120, 135, 117.5, 160],
                color: '#f45b5b',
                marker: {
                    lineWidth: 2,
                    lineColor: '#f45b5b',
                    fillColor: 'white'
                }
            }]
        });
    </script>
</body>

</html>
